<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 詳細: 上にタイトルと件数、右上に最終取得と「更新」、本体の上に取れなかったものと注記、その下に1件ずつ項目・本文・子・コメント */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --sunken: #eef0f4; --fg: #1c2230; --muted: #5b6475; --line: #dce0e7;
  --accent: #2c56c9; --warn-bg: #fdf1dc; --warn-fg: #6e4300;
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --sunken: #20252f; --fg: #e3e7ee; --muted: #98a1b1; --line: #2d333e;
    --accent: #8ea9ff; --warn-bg: #3a2b12; --warn-fg: #f2c979; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --sunken: #20252f; --fg: #e3e7ee; --muted: #98a1b1; --line: #2d333e;
  --accent: #8ea9ff; --warn-bg: #3a2b12; --warn-fg: #f2c979; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.5; }
[hidden] { display: none !important; }
.page {
  display: grid; gap: 16px; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; min-width: 0; }
h1 { margin: 0; font-size: 1.25rem; line-height: 1.3; text-wrap: balance; }
.count, .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.meta { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
button {
  font: inherit; color: var(--accent); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 14px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.notice { margin: 0; padding: 8px 12px 8px 28px; border-radius: 6px; font-size: 0.9rem; display: grid; gap: 2px; }
.failures { background: var(--warn-bg); color: var(--warn-fg); }
.notes { background: var(--sunken); color: var(--muted); }
main { display: grid; gap: 16px; min-width: 0; }
.item { display: grid; gap: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.item h2 { margin: 0; font-size: 1.05rem; line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 16px; margin: 0; }
.field { min-width: 0; }
.field dt { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; }
.field dd { margin: 0; font-size: 0.9rem; overflow-wrap: anywhere; }
.field[data-field="キー"] dd, .field[data-field="URL"] dd { font-family: var(--mono); font-size: 0.82rem; }
.part { display: grid; gap: 6px; min-width: 0; }
.part h3 { margin: 0; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9rem; }
.part ul, .part ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 0.9rem; }
.part .meta { font-size: 0.78rem; }
.empty { margin: 0; color: var(--muted); }
</style>

<div class="page">
  <header class="top">
    <div class="heading">
      <h1 data-ipt="title">チケット</h1>
      <span class="count" data-ipt="count"></span>
    </div>
    <div class="meta">
      <span data-ipt="updated"></span>
      <button type="button" id="ipt-refresh" data-ipt="refresh" hidden>更新</button>
    </div>
  </header>
  <ul class="notice failures" data-ipt="failures" hidden></ul>
  <ul class="notice notes" data-ipt="notes" hidden></ul>
  <main data-ipt="body"></main>
</div>

<template data-ipt="item">
  <article class="item">
    <h2 data-ipt="item-title"></h2>
    <dl class="fields" data-ipt="fields"></dl>
    <section class="part" data-ipt="item-body"><h3>本文</h3><div class="text" data-ipt="text"></div></section>
    <section class="part" data-ipt="item-children"><h3>子</h3><ul data-ipt="children"></ul></section>
    <section class="part" data-ipt="item-comments"><h3>コメント</h3><ol data-ipt="comments"></ol></section>
  </article>
</template>

<template data-ipt="field">
  <div class="field"><dt data-ipt="label"></dt><dd data-ipt="value"></dd></div>
</template>

<script type="application/json" id="ip-tracker-view">{}</script>
<script src="render.js"></script>
<script src="runtime.js"></script>
