<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 表: 上にタイトルと件数、右上に最終取得と「更新」、本体の上に取れなかったものと注記、その下にまとまりごとの表 */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --sunken: #eef0f4; --fg: #1c2230; --muted: #5b6475; --line: #dce0e7;
  --accent: #2c56c9; --warn-bg: #fdf1dc; --warn-fg: #6e4300;
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --sunken: #20252f; --fg: #e3e7ee; --muted: #98a1b1; --line: #2d333e;
    --accent: #8ea9ff; --warn-bg: #3a2b12; --warn-fg: #f2c979; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --sunken: #20252f; --fg: #e3e7ee; --muted: #98a1b1; --line: #2d333e;
  --accent: #8ea9ff; --warn-bg: #3a2b12; --warn-fg: #f2c979; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.5; }
[hidden] { display: none !important; }
.page {
  display: grid; gap: 16px; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; min-width: 0; }
h1 { margin: 0; font-size: 1.25rem; line-height: 1.3; text-wrap: balance; }
.count, .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.meta { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
button {
  font: inherit; color: var(--accent); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 14px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.notice { margin: 0; padding: 8px 12px 8px 28px; border-radius: 6px; font-size: 0.9rem; display: grid; gap: 2px; }
.failures { background: var(--warn-bg); color: var(--warn-fg); }
.notes { background: var(--sunken); color: var(--muted); }
main { display: grid; gap: 20px; min-width: 0; }
.group { display: grid; gap: 8px; min-width: 0; }
.group h2 { margin: 0; font-size: 0.95rem; letter-spacing: 0.02em; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; background: var(--sunken); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td[data-field="キー"], td[data-field="URL"] { font-family: var(--mono); font-size: 0.82rem; white-space: nowrap; }
td[data-field="更新日"] { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
td[data-field="タイトル"] { min-width: 14em; }
.empty { margin: 0; color: var(--muted); }
</style>

<div class="page">
  <header class="top">
    <div class="heading">
      <h1 data-ipt="title">チケット</h1>
      <span class="count" data-ipt="count"></span>
    </div>
    <div class="meta">
      <span data-ipt="updated"></span>
      <button type="button" id="ipt-refresh" data-ipt="refresh" hidden>更新</button>
    </div>
  </header>
  <ul class="notice failures" data-ipt="failures" hidden></ul>
  <ul class="notice notes" data-ipt="notes" hidden></ul>
  <main data-ipt="body"></main>
</div>

<template data-ipt="group">
  <section class="group">
    <h2 data-ipt="group-name"></h2>
    <div class="scroll">
      <table>
        <thead><tr data-ipt="head"></tr></thead>
        <tbody data-ipt="rows"></tbody>
      </table>
    </div>
  </section>
</template>

<script type="application/json" id="ip-tracker-view">{}</script>
<script src="render.js"></script>
<script src="runtime.js"></script>
